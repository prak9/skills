interface:
  display_name: "Invest"
  short_description: "Explain earning power, per-share value, and price-implied returns"
  default_prompt: "Use $invest to explain how the business earns money, why its profit exists, whether it can persist, and how much normalized and future owner cash it can produce. Then trace what reaches each share and what return or loss that supports from the current price, using coherent scenarios and evidence-backed constraints."
